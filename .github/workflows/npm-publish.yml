name: Publish audiotagr to npm

# Publishing is driven by its own tag so it never rides along with an app release:
#   git tag -a audiotagr-v0.1.0 -m "audiotagr 0.1.0" && git push origin audiotagr-v0.1.0
on:
  push:
    tags: ["audiotagr-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write

    defaults:
      run:
        working-directory: packages/audiotagr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --filter narrows the install to the package, and --ignore-scripts keeps
      # the app's postinstall (prisma generate) out of a library release.
      # esbuild still needs its own postinstall to place the platform binary
      # tsup builds with, so it is rebuilt on its own.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --filter audiotagr --ignore-scripts
          pnpm rebuild esbuild
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
